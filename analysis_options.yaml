# WearWay lint config — very_good_analysis (strict preset) + custom rules.
# very_good_analysis sudah mengaktifkan prefer_const_constructors,
# always_declare_return_types, avoid_print, dll. Custom rules di bawah
# dicantumkan eksplisit sesuai PROJECT_PLAN Prompt 1 point 8.
include: package:very_good_analysis/analysis_options.yaml

analyzer:
  # Generated files (*.g.dart) tidak perlu di-lint.
  exclude:
    - "**/*.g.dart"
    - "**/*.freezed.dart"
  language:
    strict-casts: true
    strict-raw-types: true

linter:
  rules:
    avoid_print: true
    prefer_const_constructors: true
    always_declare_return_types: true
    # public_member_api_docs ditujukan untuk published package, bukan aplikasi.
    # Aplikasi WearWay bukan library → nonaktifkan biar tidak wajib dartdoc
    # di tiap member. Rule strict lain tetap aktif.
    public_member_api_docs: false
